name: Create Release

on:
  push:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      new_version: ${{ steps.version_check.outputs.new_version }}
      version_code: ${{ steps.version_check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version change
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "::error::File app/build.gradle.kts does not exist"
            exit 1
          fi

          # Extract current versionName and versionCode from Gradle
          CURRENT_VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -m1 -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")
          CURRENT_VERSION=$(echo "$CURRENT_VERSION" | xargs)
          
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          # Fetch latest release tag from GitHub
          LATEST_TAG=$(gh release list \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' |
            sed 's/^v//' |
            sort -V |
            tail -n 1)
          LATEST_VERSION=$(echo "$LATEST_TAG" | xargs)

          echo "Gradle version: $CURRENT_VERSION"
          echo "Latest release: ${LATEST_TAG:-None}"

          # Version comparison function
          # Returns: 0 if equal, 1 if v1 > v2, 2 if v2 > v1
          vercomp () {
              if [[ $1 == $2 ]]; then return 0; fi
              local IFS=.
              local i ver1=($1) ver2=($2)
              # fill empty fields in ver1 with zeros
              for ((i=${#ver1[@]}; i<${#ver2[@]}; i++)); do ver1[i]=0; done
              # fill empty fields in ver2 with zeros
              for ((i=${#ver2[@]}; i<${#ver1[@]}; i++)); do ver2[i]=0; done
              for ((i=0; i<${#ver1[@]}; i++)); do
                  if [[ -z ${ver2[i]} ]]; then ver2[i]=0; fi
                  if ((10#${ver1[i]} > 10#${ver2[i]})); then return 1; fi
                  if ((10#${ver1[i]} < 10#${ver2[i]})); then return 2; fi
              done
              return 0
          }

          if [ -z "$LATEST_VERSION" ]; then
            echo "No previous release found. Initial release."
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          else
            # Run vercomp and capture result without exiting on non-zero
            vercomp "$CURRENT_VERSION" "$LATEST_VERSION" && res=$? || res=$?
          
            if [ $res -eq 1 ]; then
              echo "Version upgrade detected: $LATEST_VERSION -> $CURRENT_VERSION"
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
              echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            elif [ $res -eq 2 ]; then
              echo "::error::Version downgrade detected! Gradle version ($CURRENT_VERSION) is lower than latest release ($LATEST_VERSION)."
              exit 1
            else
              echo "Version is up to date ($CURRENT_VERSION). Skipping release."
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools from: $BUILD_TOOLS_PATH"
          
          mkdir -p release_apks
          
          for APK in $(find app/build/outputs/apk/release -name "*.apk"); do
            BASENAME=$(basename "$APK")
            echo "Processing $BASENAME..."
            
            if [[ "$BASENAME" == *"arm64-v8a"* ]]; then
              OUT_NAME="Bunori_arm64-v8a.apk"
            elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
              OUT_NAME="Bunori_armeabi-v7a.apk"
            elif [[ "$BASENAME" == *"x86_64"* ]]; then
              OUT_NAME="Bunori_x86_64.apk"
            elif [[ "$BASENAME" == *"universal"* ]]; then
              OUT_NAME="Bunori_universal.apk"
            else
              OUT_NAME="Bunori_${BASENAME}"
            fi
          
            echo "Signing $APK -> release_apks/$OUT_NAME"
            $BUILD_TOOLS_PATH/apksigner sign \
              --ks release.jks \
              --ks-key-alias "${{ secrets.ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "release_apks/$OUT_NAME" \
              "$APK"
          done

          rm release.jks

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "Extracting release notes for version $VERSION..."
          
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver { flag=1; next }
              flag && /^## / { flag=0 }
              flag { print }
            ' CHANGELOG.md > release_notes.md
          fi
          
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for version $VERSION. Using default fallback."
            echo "Release v$VERSION" > release_notes.md
          fi

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Release v${{ needs.check-version.outputs.new_version }}
          body_path: release_notes.md
          draft: true
          prerelease: ${{ contains(needs.check-version.outputs.new_version, '-alpha') || contains(needs.check-version.outputs.new_version, '-beta') || contains(needs.check-version.outputs.new_version, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
