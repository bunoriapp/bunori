name: Bug Report
description: Report a bug in Bunori
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        > [!NOTE]
        > If the issue is specific to a particular novel source or crawler,
        > please report it in [Extensions](https://github.com/bunoriapp/bunori) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this hasn't been reported already
          required: true
        - label: This bug is in Bunori itself, not a specific novel source
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - App / UI
        - Downloading or crawling (general, not source-specific)
        - Export / file format
        - Installation or setup
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bunori version
      description: Check the app's About screen if unsure.
      placeholder: "v1.x.x"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: What did you do, and what went wrong?
      description: |
        Walk through the steps you took, then tell us what you expected vs. what actually happened.
        This is the most important field — a clear walkthrough saves several rounds of back-and-forth.
      placeholder: |
        1. Opened...
        2. Selected...
        3. Pressed...

        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages / screenshots
      description: Paste any console output, stack traces, or attach screenshots. This is often the fastest way for us to spot the issue.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Anything else that may help — OS, environment, whether it's reproducible every time, etc.
