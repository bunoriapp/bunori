name: Feature Request
description: Suggest an improvement or new feature for Bunori
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues/discussions and this hasn't been suggested already
          required: true

  - type: dropdown
    id: category
    attributes:
      label: What area does this relate to?
      options:
        - App / UI
        - Downloading or crawling (general)
        - Export / file format
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem or limitation you're running into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
      description: Anything you've tried, considered, or found elsewhere that solves this partially.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this
